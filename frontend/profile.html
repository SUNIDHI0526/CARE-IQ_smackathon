<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page</title>
    <link rel="stylesheet" href="./CSS/profile.css">
</head>
<body>

    <h1 class="top-profile-text">PROFILE</h1>
    
    <div class="mobile-mockup-frame">
        
        <!-- Top screen title -->
        <div class="screen-header">
            <span class="screen-title">Profile</span>
        </div>

        <!-- White card-like element for user info -->
        <div class="user-profile-card">
            <img src="path/to/avatar.jpg" alt="Profile Picture" class="profile-avatar">
            
            <div class="profile-details">
                <h2 class="profile-name">Sunidhi Borutkar</h2>
                <p class="profile-id">ABHA ID: 91-XXXX-XXXX-1234</p>
            </div>
        </div>

        <!-- Main Menu List -->
        <div class="menu-list-card">
            
            <!-- Item 1: Personal Details -->
            <div class="menu-item">
                <div class="menu-item-left">
                    <i class="icon-personal-details menu-icon"></i>
                    <span class="menu-text">Personal Details</span>
                </div>
                <div class="menu-item-right">
                    <i class="icon-chevron-right"></i>
                </div>
            </div>

            <!-- Item 2: Family Members -->
            <div class="menu-item">
                <div class="menu-item-left">
                    <i class="icon-family-members menu-icon"></i>
                    <span class="menu-text">Family Members</span>
                </div>
                <div class="menu-item-right">
                    <span class="menu-tag">3 Members</span>
                    <i class="icon-chevron-right"></i>
                </div>
            </div>

            <!-- Item 3: ABHA & Health ID -->
            <div class="menu-item">
                <div class="menu-item-left">
                    <i class="icon-abha-health-id menu-icon"></i>
                    <span class="menu-text">ABHA & Health ID</span>
                </div>
                <div class="menu-item-right">
                    <i class="icon-chevron-right"></i>
                </div>
            </div>

            <!-- Item 4: Settings -->
            <div class="menu-item">
                <div class="menu-item-left">
                    <i class="icon-settings menu-icon"></i>
                    <span class="menu-text">Settings</span>
                </div>
                <div class="menu-item-right">
                    <i class="icon-chevron-right"></i>
                </div>
            </div>

            <!-- Item 5: Help & Support -->
            <div class="menu-item">
                <div class="menu-item-left">
                    <i class="icon-help-support menu-icon"></i>
                    <span class="menu-text">Help & Support</span>
                </div>
                <div class="menu-item-right">
                    <i class="icon-chevron-right"></i>
                </div>
            </div>
            
            <!-- Logout Button -->
            <div class="menu-item logout-btn">
                <div class="menu-item-left">
                    <i class="icon-logout"></i>
                    <span class="logout-text">Logout</span>
                </div>
            </div>
            
        </div>

        <!-- Bottom Navigation Bar -->
        <div class="bottom-nav">
            <div class="nav-item">
                <i class="nav-icon icon-home"></i>
                <span class="nav-text">Home</span>
            </div>
            
            <div class="nav-item">
                <i class="nav-icon icon-scan"></i>
                <span class="nav-text">Scan</span>
            </div>
            
            <div class="nav-item">
                <i class="nav-icon icon-ai"></i>
                <span class="nav-text">AI</span>
            </div>
            
            <div class="nav-item">
                <i class="nav-icon icon-alerts"></i>
                <span class="nav-text">Alerts</span>
            </div>
            
            <!-- Active Item: Profile -->
            <div class="nav-item active">
                <i class="nav-icon icon-profile-nav"></i>
                <span class="nav-text">Profile</span>
            </div>
        </div>

    </div>

</body>
</html>
