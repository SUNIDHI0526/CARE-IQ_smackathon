<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Profile Page - Desktop View</title>
    <link rel="stylesheet" href="./CSS/profile.css"> <!-- Ensure this points to your CSS file -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
</head>
<body>

    <div class="desktop-dashboard">
        
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div class="brand-header">
                <h2>CARE-IQ</h2>
            </div>
            <div class="side-nav">
                <div class="nav-item">
                    <i class="nav-icon fa-solid fa-house"></i>
                    <span class="nav-text">Home</span>
                </div>
                <div class="nav-item">
                    <i class="nav-icon fa-solid fa-qrcode"></i>
                    <span class="nav-text">Scan</span>
                </div>
                <div class="nav-item">
                    <i class="nav-icon fa-solid fa-robot"></i>
                    <span class="nav-text">AI Assistant</span>
                </div>
                <div class="nav-item">
                    <i class="nav-icon fa-solid fa-bell"></i>
                    <span class="nav-text">Alerts</span>
                </div>
                <!-- Active Item: Profile -->
                <div class="nav-item active">
                    <i class="nav-icon fa-solid fa-user"></i>
                    <span class="nav-text">Profile</span>
                </div>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            
            <header class="screen-header">
                <h1 class="screen-title">Profile Settings</h1>
            </header>

            <!-- User Info Card -->
            <div class="user-profile-card">
                <img src="https://ui-avatars.com/api/?name=Sunidhi+Borutkar&background=145c28&color=fff&size=128" alt="Profile Picture" class="profile-avatar">
                
                <div class="profile-details">
                    <h2 class="profile-name">Sunidhi Borutkar</h2>
                    <p class="profile-id">ABHA ID: 91-XXXX-XXXX-1234</p>
                </div>
                
                <button class="edit-btn">Edit Profile</button>
            </div>

            <!-- Main Menu List -->
            <div class="menu-list-card">
                
                <div class="menu-item">
                    <div class="menu-item-left">
                        <i class="menu-icon fa-solid fa-address-card"></i>
                        <span class="menu-text">Personal Details</span>
                    </div>
                    <div class="menu-item-right">
                        <i class="icon-chevron-right fa-solid fa-chevron-right"></i>
                    </div>
                </div>

                <div class="menu-item">
                    <div class="menu-item-left">
                        <i class="menu-icon fa-solid fa-users"></i>
                        <span class="menu-text">Family Members</span>
                    </div>
                    <div class="menu-item-right">
                        <span class="menu-tag">3 Members</span>
                        <i class="icon-chevron-right fa-solid fa-chevron-right"></i>
                    </div>
                </div>

                <div class="menu-item">
                    <div class="menu-item-left">
                        <i class="menu-icon fa-solid fa-id-card"></i>
                        <span class="menu-text">ABHA & Health ID</span>
                    </div>
                    <div class="menu-item-right">
                        <i class="icon-chevron-right fa-solid fa-chevron-right"></i>
                    </div>
                </div>

                <div class="menu-item">
                    <div class="menu-item-left">
                        <i class="menu-icon fa-solid fa-gear"></i>
                        <span class="menu-text">Settings</span>
                    </div>
                    <div class="menu-item-right">
                        <i class="icon-chevron-right fa-solid fa-chevron-right"></i>
                    </div>
                </div>

                <div class="menu-item">
                    <div class="menu-item-left">
                        <i class="menu-icon fa-solid fa-circle-question"></i>
                        <span class="menu-text">Help & Support</span>
                    </div>
                    <div class="menu-item-right">
                        <i class="icon-chevron-right fa-solid fa-chevron-right"></i>
                    </div>
                </div>
                
                <div class="menu-item logout-btn">
                    <div class="menu-item-left">
                        <i class="icon-logout fa-solid fa-arrow-right-from-bracket"></i>
                        <span class="logout-text">Logout</span>
                    </div>
                </div>
                
            </div>
        </main>
    </div>

</body>
</html>
